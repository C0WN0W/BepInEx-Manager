<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; script-src 'self'" />
  <title>BepInEx Manager</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme-init.js"></script>
</head>
<body>
  <div id="app">
    <!-- ===== Home ===== -->
    <section id="view-home" class="view active">
      <button id="settings-btn" class="btn btn-icon home-settings" title="Settings" type="button">
        <i class="fa-solid fa-gear"></i>
      </button>
      <div class="home">
        <div class="home-logo">
          <i class="fa-solid fa-cubes-stacked"></i>
        </div>
        <h1 class="home-title">BepInEx Manager</h1>
        <p class="home-subtitle">Manage your Unity mods with ease</p>
        <button id="start-btn" class="btn btn-filled btn-large" type="button">
          <i class="fa-solid fa-play"></i>
          <span>START</span>
        </button>
      </div>
    </section>

    <!-- ===== Games list ===== -->
    <section id="view-games" class="view">
      <header class="app-bar">
        <button id="back-btn" class="btn btn-icon" title="Back" type="button">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h2 class="app-bar-title">Installed Games</h2>
        <span id="games-count" class="chip"></span>
        <button id="refresh-btn" class="btn btn-icon" title="Rescan" type="button">
          <i class="fa-solid fa-rotate"></i>
        </button>
      </header>
      <div id="games-content" class="games-content"></div>
    </section>

    <!-- ===== Game detail ===== -->
    <section id="view-detail" class="view">
      <header class="app-bar">
        <button id="detail-back-btn" class="btn btn-icon" title="Back" type="button">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h2 id="detail-title" class="app-bar-title">Game</h2>
      </header>
      <div class="detail-content">
        <aside id="detail-left"  class="detail-panel detail-left"></aside>
        <aside id="detail-right" class="detail-panel detail-right"></aside>
      </div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
